<meta charset="utf-8">

<meta name="robots" content="noindex,nofollow">
<title>Deine Antworten · Hildegard's Secret</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700&family=Alegreya+Sans:wght@400;700&display=swap">
<style>
:root { --paper: #f1f4ec; --surface: #fafbf7; --ink: #1c2a21; --soft: #4d5b50; --forest: #2b5336; --on: #ffffff; --line: #d2dbc9; --crit: #a13a29; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --paper: #111813; --surface: #18211a; --ink: #e3eadf; --soft: #a8b5a9; --forest: #8cc49a; --on: #0f1a12; --line: #2c3b30; --crit: #f0907f; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: "Alegreya Sans", "Segoe UI", system-ui, sans-serif; font-size: 17px; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
.card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 32px 28px; display: grid; gap: 16px; }
.eb { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--forest); }
h1 { font-family: "Alegreya", Georgia, serif; font-size: 1.9rem; line-height: 1.15; margin: 0; }
p { margin: 0; color: var(--soft); line-height: 1.5; }
form { display: grid; gap: 12px; }
label { font-weight: 700; font-size: .95rem; display: grid; gap: 6px; }
input[type=password], input[type=text] { font: inherit; padding: 11px 13px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); color: var(--ink); width: 100%; }
.remember { display: flex; gap: 8px; align-items: center; font-weight: 400; font-size: .92rem; color: var(--soft); }
.remember input { width: 18px; height: 18px; accent-color: var(--forest); }
button { font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 9px; padding: 12px 16px; background: var(--forest); color: var(--on); }
button:disabled { opacity: .7; cursor: wait; }
.err { color: var(--crit); font-size: .92rem; min-height: 1.3em; }
:focus-visible { outline: 3px solid var(--forest); outline-offset: 2px; }
</style>
</head>
<body>
<main class="card">
  <span class="eb">Hildegard's Secret</span>
  <h1>Deine Antworten</h1>
  <p>Diese Seite ist geschützt. Gib bitte das Passwort ein, das du von René bekommen hast.</p>
  <form id="f">
    <label for="pw">Passwort<input type="password" id="pw" autocomplete="current-password" autocapitalize="off" spellcheck="false" required></label>
    <label class="remember" for="rem"><input type="checkbox" id="rem" checked> Auf diesem Gerät angemeldet bleiben</label>
    <button type="submit" id="go">Öffnen</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <noscript><p>Bitte aktiviere JavaScript, um die Seite zu öffnen.</p></noscript>
</main>

<style>
:root { --paper: #f1f4ec; --surface: #fafbf7; --ink: #1c2a21; --soft: #4d5b50; --forest: #2b5336; --on: #ffffff; --line: #d2dbc9; --crit: #a13a29; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --paper: #111813; --surface: #18211a; --ink: #e3eadf; --soft: #a8b5a9; --forest: #8cc49a; --on: #0f1a12; --line: #2c3b30; --crit: #f0907f; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: "Alegreya Sans", "Segoe UI", system-ui, sans-serif; font-size: 17px; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
.card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 32px 28px; display: grid; gap: 16px; }
.eb { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--forest); }
h1 { font-family: "Alegreya", Georgia, serif; font-size: 1.9rem; line-height: 1.15; margin: 0; }
p { margin: 0; color: var(--soft); line-height: 1.5; }
form { display: grid; gap: 12px; }
label { font-weight: 700; font-size: .95rem; display: grid; gap: 6px; }
input[type=password], input[type=text] { font: inherit; padding: 11px 13px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); color: var(--ink); width: 100%; }
.remember { display: flex; gap: 8px; align-items: center; font-weight: 400; font-size: .92rem; color: var(--soft); }
.remember input { width: 18px; height: 18px; accent-color: var(--forest); }
button { font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 9px; padding: 12px 16px; background: var(--forest); color: var(--on); }
button:disabled { opacity: .7; cursor: wait; }
.err { color: var(--crit); font-size: .92rem; min-height: 1.3em; }
:focus-visible { outline: 3px solid var(--forest); outline-offset: 2px; }
</style>
</head>

<main class="card">

  <h1>Website-Vorschau</h1>
  <p>Diese Seite ist geschützt. Gib bitte das Passwort ein, das du von René bekommen hast.</p>

    <button type="submit" id="go">Öffnen</button>
    <div class="err" id="err" role="alert"></div>
  </form>

  function saveKey(raw, remember) { var val = JSON.stringify({ salt: C.salt, key: raw }); [["sessionStorage", true], ["localStorage", remember]].forEach(function (x) { var s = store(x[0]); try { if (s) { if (x[1]) s.setItem(KEY_NAME, val); else s.removeItem(KEY_NAME); } } catch (e) {} }); }
  function clearKey() { ["sessionStorage", "localStorage"].forEach(function (n) { var s = store(n); try { if (s) s.removeItem(KEY_NAME); } catch (e) {} }); }
  function show(html) {
    var go = function () { document.open(); document.write(html); document.close(); };
    if (document.readyState === "complete") go(); else window.addEventListener("load", go, { once: true });
  }
  function decrypt(key) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(C.iv) }, key, b64(DATA)).then(function (pt) { return new TextDecoder().decode(pt); }); }
  var err = document.getElementById("err");
  if (!window.crypto || !crypto.subtle) { err.textContent = "Dein Browser kann die Seite nicht entschlüsseln. Bitte öffne sie in einem aktuellen Browser über https."; return; }
  var saved = readKey();
  if (saved) {
    var card = document.querySelector(".card");
    card.style.visibility = "hidden";
    crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]).then(decrypt).then(show)
      .catch(function () { clearKey(); card.style.visibility = ""; });
  }
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = document.getElementById("go"), pw = document.getElementById("pw").value.trim();
    err.textContent = ""; btn.disabled = true; btn.textContent = "Wird geöffnet …";
    crypto.subtle.importKey("raw", new TextEncoder().encode(pw.normalize("NFC")), "PBKDF2", false, ["deriveKey"])
      .then(function (base) { return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(C.salt), iterations: C.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]); })
      .then(function (key) { return decrypt(key).then(function (html) { return crypto.subtle.exportKey("raw", key).then(function (raw) { saveKey(toB64(raw), document.getElementById("rem").checked); show(html); }); }); })
      .catch(function () { btn.disabled = false; btn.textContent = "Öffnen"; err.textContent = "Das Passwort stimmt nicht. Achte auf Groß- und Kleinschreibung und die Bindestriche."; });
  });
})();
